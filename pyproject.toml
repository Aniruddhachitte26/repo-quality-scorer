[project]
name = "repo-scorer"
version = "0.1.0"
description = "Agentic code-quality scoring for Python repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gitpython",
    "httpx",
    "radon",
    "networkx",
    "typer",
    "python-dotenv",
    "sqlalchemy",
    "psycopg[binary]",
    "anthropic",
    "packaging",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
repo-scorer = "repo_scorer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
